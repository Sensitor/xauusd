# Prometheus scrape config for the GoldMind stack.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: goldmind-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: goldmind-api

  # The execution node (Windows/Wine) can expose its own client metrics on :9000.
  # - job_name: goldmind-execution
  #   static_configs:
  #     - targets: ["execution-node:9000"]
